ickets"></h3><p data-i="serviceTicketsDesc"></p></div><div><h3 data-i="serviceMaintenance"></h3><p data-i="serviceMaintenanceDesc"></p></div><div><h3 data-i="serviceBookings"></h3><p data-i="serviceBookingsDesc"></p></div><div><h3 data-i="serviceVendors"></h3><p data-i="serviceVendorsDesc"></p></div></div></section><section><h2 data-i="about"></h2><p data-i="aboutText"></p></section></main><script>const shabbatLabels={fr:{loading:"Chargement des horaires de Tel-Aviv…",error:"Horaires indisponibles pour le moment. Réessayez plus tard.",candle:"Allumage des bougies",havdalah:"Sortie de Shabbat",parasha:"Paracha",source:"Source : Hebcal · Tel-Aviv · allumage 18 min avant le coucher du soleil",date:"fr-FR"},he:{loading:"טוען זמני שבת לתל אביב…",error:"לא ניתן לטעון את זמני השבת כרגע. נסו שוב מאוחר יותר.",candle:"הדלקת נרות",havdalah:"צאת שבת",parasha:"פרשת השבוע",source:"מקור: Hebcal · תל אביב · הדלקת נרות 18 דקות לפני השקיעה",date:"he-IL"},en:{loading:"Loading Tel Aviv Shabbat times…",error:"Shabbat times are temporarily unavailable. Please try again later.",candle:"Candle lighting",havdalah:"Shabbat ends",parasha:"Weekly portion",source:"Source: Hebcal · Tel Aviv · candle lighting 18 minutes before sunset",date:"en-GB"}};let shabbatData=null;function renderShabbat(){const lang=document.documentElement.lang;const l=shabbatLabels[lang]||shabbatLabels.fr;document.querySelector("#shabbatDetails").hidden=!shabbatData;document.querySelector("#shabbatStatus").textContent=shabbatData?"":(window.shabbatError?l.error:l.loading);document.querySelector("#shabbatSource").textContent=shabbatData?l.source:"";if(!shabbatData)return;const fmt=d=>new Intl.DateTimeFormat(l.date,{timeZone:"Asia/Jerusalem",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(d));const dateFmt=new Intl.DateTimeFormat(l.date,{timeZone:"Asia/Jerusalem",weekday:"long",day:"numeric",month:"long"});document.querySelector("#shabbatDate").textContent=dateFmt.format(new Date(shabbatData.candle.date));document.querySelector("#candleLabel").textContent=l.candle;document.querySelector("#havdalahLabel").textContent=l.havdalah;document.querySelector("#candleTime").textContent=fmt(shabbatData.candle.date);document.querySelector("#havdalahTime").textContent=shabbatData.havdalah?fmt(shabbatData.havdalah.date):"—";document.querySelector("#shabbatParasha").textContent=shabbatData.parasha?l.parasha+": "+(lang==="he"?(shabbatData.parasha.hebrew||shabbatData.parasha.title):(shabbatData.parasha.title||"").replace(/^Parashat /,"")):"";}async function loadShabbat(){try{const resp=await fetch("https://www.hebcal.com/shabbat?cfg=json&geonameid=293397&b=18&M=on",{cache:"no-store"});if(!resp.ok)throw Error("HTTP "+resp.status);const data=await resp.json();if(!Array.isArray(data.items))throw Error("Missing items");const now=Date.now();const candles=data.items.filter(i=>i.category==="candles"&&new Date(i.date).getTime()>now-3600000).sort((a,b)=>new Date(a.date)-new Date(b.date));const candle=candles[0];if(!candle)throw Error("No upcoming candles");const after=new Date(candle.date).getTime();const nextCandle=candles[1]?new Date(candles[1].date).getTime():after+8*86400000;const windowItems=data.items.filter(i=>{const d=new Date(i.date).getTime();return d>=after&&d<nextCandle});const havdalah=windowItems.find(i=>i.category==="havdalah");const parasha=windowItems.find(i=>i.category==="parashat");shabbatData={candle,havdalah,parasha};window.shabbatError=false;}catch(e){window.shabbatError=true;shabbatData=null;}renderShabbat();}loadShabbat();const translations={"fr":{"servicesTitle":"Services de la résidence","serviceTickets":"Suivi des demandes","serviceTicketsDesc":"À venir : numéro de dossier, priorité, responsable et progression visible par le résident.","serviceMaintenance":"Entretien préventif","serviceMaintenanceDesc":"À venir : calendrier des vérifications des ascenseurs, pompes et équipements communs.","serviceBookings":"Réservation des espaces","serviceBookingsDesc":"À étudier selo nal information.","tower":"Tower","choose":"Choose","apartment":"Apartment number","category":"Category","description":"Description","placeholder":"Describe the issue without personal details","preview":"Preview report","shabbat":"Shabbat & holidays","shabbatText":"Check updated Shabbat times for Tel Aviv.","shabbatLink":"Shabbat times in Tel Aviv","holidays":"Jewish holiday calendar","directory":"Directory","directoryText":"Professional contacts will be published after verification and permission.","life":"Community","lifeText":"News, maintenance, meetings, lost and found, and neighbor support.","tracking":"Issue tracking","trackingText":"Coming soon: duplicate issue grouping, status and management notifications.","about":"About this version","aboutText":"Public demo without a connected database, resident accounts or email delivery. Do not use for real requests.","result":"Preview only: report not sent.","categories":["Elevator","Cleaning","Electricity","Water / leak","Security","Other"]}};function setLang(lang){if(!translations[lang])lang="fr";const t=translations[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="he"?"rtl":"ltr";document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t[el.dataset.i]);document.querySelectorAll("[data-lang]").forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.lang===lang)));const tower=document.querySelector("#tower");tower.replaceChildren();[t.choose,...Array.from({length:4},(_,i)=>t.tower+" "+(i+1))].forEach((v,i)=>{const o=document.createElement("option");o.textContent=v;o.value=i?v:"";tower.append(o)});const cat=document.querySelector("#category");cat.replaceChildren();t.categories.forEach(v=>{const o=document.createElement("option");o.textContent=v;cat.append(o)});document.querySelector("#description").placeholder=t.placeholder;document.querySelector("#result").textContent="";renderShabbat();try{localStorage.setItem("florentine-lang",lang)}catch(e){}}document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));document.querySelector("#report").addEventListener("submit",e=>{e.preventDefault();document.querySelector("#result").textContent=translations[document.documentElement.lang].result});let lang="fr";try{lang=localStorage.getItem("florentine-lang")||((navigator.language||"fr").startsWith("he")?"he":(navigator.language||"fr").startsWith("en")?"en":"fr")}catch(e){}setLang(lang);</script></body></html>
